# Local stack: API + datastore on a private network. Brought up with
# `docker compose up --build`.
#
# No top-level `version:` key -- obsolete since Compose v2, and current
# releases warn about it.

services:
  api:
    build:
      context: .
      target: runtime          # skip the test stage for local runs
    image: macky-merch-api:local
    init: true                 # PID 1 that reaps zombies and forwards SIGTERM
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"  # loopback only, not 0.0.0.0
    environment:
      NODE_ENV: production
      PORT: 3000
      # Resolves over the `backend` network's embedded DNS. Reachable but
      # unused: server.js keeps its baseline behaviour per the starter repo.
      REDIS_URL: redis://cache:6379
    depends_on:
      cache:
        condition: service_healthy   # readiness, not just container creation
    networks:
      - backend
    # The app never writes to its own filesystem and never needs new
    # privileges, so both are taken away.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - cache-data:/data
    networks:
      - backend
    # No `ports:` on purpose -- reachable only from inside `backend`, never
    # from the host.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge

volumes:
  cache-data:
