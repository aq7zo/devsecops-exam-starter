# Without automated bumps, `dependency-scan` eventually goes red on a
# dependency nobody has time to update, and the gate gets disabled instead.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all dev-dependency bumps: review fatigue is the main
      # reason these updates get ignored.
      dev-dependencies:
        dependency-type: development

  # Most image CVEs come from the base layer, not from our code.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Third-party code running with repository credentials.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # security-demo/ is deliberately unwatched: its dependencies are pinned to
  # vulnerable versions and must stay that way.
