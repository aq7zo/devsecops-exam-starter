name: CodeQL

# SAST, complementing the scanners in ci.yml: no advisory database can list a
# bug that exists only in this repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # CodeQL's query packs change even when the code does not, so a file
    # committed today can become a finding next month without any push.
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # publish findings to the Security tab
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Lower-confidence queries on top of the default set; the extra
          # noise is affordable on a codebase this small.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
