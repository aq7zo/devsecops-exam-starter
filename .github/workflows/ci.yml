name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs needing more (SARIF upload) opt in
# individually, so a compromised action elsewhere cannot write to the repo.
permissions:
  contents: read

# Cancel superseded PR runs, but never a run on main -- those results are the
# recorded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: macky-merch-api
  TRIVY_SEVERITY: HIGH,CRITICAL
  # Pinned image rather than the marketplace action, which re-downloads the
  # Trivy binary from GitHub Releases on every run. Same approach as Gitleaks
  # below: fewer moving parts, and a reproducible scanner version.
  TRIVY_IMAGE: aquasec/trivy:0.65.0

jobs:
  # Same Node major as the image: the container is the only way this ships.
  test:
    name: Test (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm          # keyed on package-lock.json

      # `npm ci` fails loudly when package.json and the lockfile disagree;
      # `npm install` would rewrite the lockfile, so the tree under test would
      # not be the tree that was reviewed.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Blocking scan of the real dependency tree. security-demo/ is skipped here;
  # it has its own job below.
  dependency-scan:
    name: Dependency scan (Trivy + npm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # publishing SARIF only
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gated at `high`: moderate findings are reported but do not block, so
      # the pipeline does not train people to ignore a red gate.
      - name: npm audit (report, all severities)
        run: npm audit || true

      - name: npm audit (gate, high+)
        run: npm audit --audit-level=high

      # Different advisory source than npm audit, so the two overlap rather
      # than duplicate.
      - name: Trivy filesystem scan (blocking)
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" fs             --scanners vuln,secret             --severity "$TRIVY_SEVERITY"             --ignore-unfixed             --skip-dirs security-demo             --exit-code 1             --format table             .

      # misconfig is reported but not gated: its policy set changes between
      # Trivy releases, which would make this a flaky blocker on unrelated PRs.
      - name: Trivy filesystem scan (SARIF for code scanning)
        if: always()
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" fs             --scanners vuln,secret,misconfig             --skip-dirs security-demo             --exit-code 0             --format sarif             --output trivy-fs.sarif             .

      - name: Publish results to the GitHub Security tab
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # Scans the full history, not just the working tree: a secret deleted in a
  # later commit is still leaked.
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # every commit; the default clone is shallow

      # The marketplace action requires a GITLEAKS_LICENSE for organisation
      # accounts; a pinned image also keeps the ruleset reproducible.
      - name: Gitleaks (working tree + history)
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.21.2 \
            detect \
              --source /repo \
              --config /repo/.gitleaks.toml \
              --redact \
              --verbose \
              --exit-code 1

  # Cheap enough to gate the build job on.
  lint-dockerfile:
    name: Lint Dockerfile (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  build:
    name: Build image, smoke test, scan
    runs-on: ubuntu-latest
    needs: [test, lint-dockerfile]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Runs the suite inside the image, catching a test that passes on the
      # runner but fails in the container.
      - name: Build test stage (runs the suite inside the image)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true          # into the local daemon, so the image can be run
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A later edit that drops `USER node` fails CI instead of silently
      # shipping a root container.
      - name: Assert the container does not run as root
        run: |
          USER_ID=$(docker run --rm --entrypoint id "${IMAGE_NAME}:${GITHUB_SHA}" -u)
          USER_NAME=$(docker run --rm --entrypoint id "${IMAGE_NAME}:${GITHUB_SHA}" -un)
          echo "Container runs as ${USER_NAME} (uid ${USER_ID})"
          if [ "$USER_ID" = "0" ]; then
            echo "::error::Container is running as root -- USER directive missing or overridden."
            exit 1
          fi
          echo "### Runtime user" >> "$GITHUB_STEP_SUMMARY"
          echo "Container runs as \`${USER_NAME}\` (uid ${USER_ID}) — non-root ✅" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test /health against the real container
        run: |
          docker run -d --init --name smoke -p 3000:3000 \
            "${IMAGE_NAME}:${GITHUB_SHA}"

          # Polling rather than a fixed sleep: reports the actual failure
          # instead of guessing a startup time.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /tmp/health.json; then
              echo "Healthy after ${i}s:"
              cat /tmp/health.json
              echo
              if grep -q '"status":"OK"' /tmp/health.json; then
                exit 0
              fi
              echo "::error::/health responded but the payload was unexpected."
              exit 1
            fi
            sleep 1
          done

          echo "::error::Container never became healthy."
          docker logs smoke
          exit 1

      - name: Container logs (on failure)
        if: failure()
        run: docker logs smoke || true

      - name: Stop the smoke container
        if: always()
        run: docker rm -f smoke || true

      # Covers the base image layers, which the filesystem scan above cannot
      # see. Exported to a tar and scanned with --input rather than mounting
      # the Docker socket, which would grant the scanner control of the daemon.
      - name: Export image for scanning
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" -o image.tar

      - name: Trivy image scan (blocking)
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" image             --input image.tar             --severity "$TRIVY_SEVERITY"             --ignore-unfixed             --exit-code 1             --format table

      - name: Trivy image scan (SARIF)
        if: always()
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" image             --input image.tar             --exit-code 0             --format sarif             --output trivy-image.sarif

      - name: Publish image findings to the Security tab
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Generate SBOM (CycloneDX)
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" image             --input image.tar             --format cyclonedx             --output sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

      - name: Report image size
        run: |
          echo "### Image size" >> "$GITHUB_STEP_SUMMARY"
          docker images "${IMAGE_NAME}:${GITHUB_SHA}" \
            --format '- `{{.Repository}}:{{.Tag}}` — **{{.Size}}**' >> "$GITHUB_STEP_SUMMARY"

  # Inverted gate: this job fails when the scanners come back CLEAN, so a
  # scanner that is broken, misconfigured or silently disabled breaks the build
  # instead of reporting green.
  vulnerability-demo:
    name: Prove the scanners catch the planted vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: npm audit MUST flag the planted dependencies
        working-directory: security-demo
        run: |
          set +e
          npm audit --audit-level=high 2>&1 | tee audit.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::npm audit found nothing in security-demo/. The planted vulnerabilities are missing or the gate is broken."
            exit 1
          fi
          echo "npm audit exited ${STATUS} -- planted dependency vulnerabilities detected."
          {
            echo "### Planted dependency vulnerabilities (detected)"
            echo '```'
            head -60 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy scans the planted fixture
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" fs             --scanners vuln             --severity HIGH,CRITICAL             --exit-code 0             --format json             --output demo-trivy.json             security-demo

      - name: Assert Trivy found something
        run: |
          COUNT=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' demo-trivy.json)
          echo "Trivy HIGH/CRITICAL findings in security-demo/: ${COUNT}"
          if [ "${COUNT:-0}" -lt 1 ]; then
            echo "::error::Trivy reported no HIGH/CRITICAL findings in the deliberately vulnerable fixture."
            exit 1
          fi
          {
            echo "### Trivy detected ${COUNT} HIGH/CRITICAL issue(s) in security-demo/"
            echo ''
            echo '| Package | Installed | Severity | Advisory |'
            echo '|---|---|---|---|'
            jq -r '.Results[]?.Vulnerabilities // [] | .[] | "| \(.PkgName) | \(.InstalledVersion) | \(.Severity) | \(.VulnerabilityID) |"' demo-trivy.json | sort -u | head -25
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gitleaks MUST flag the planted fake credentials
        run: |
          set +e
          docker run --rm -v "$PWD/security-demo:/scan" \
            zricethezav/gitleaks:v8.21.2 \
            detect --source /scan --no-git --redact --verbose \
                   --report-format json --report-path /scan/leaks.json
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::Gitleaks found no secrets in security-demo/. The planted fake credentials are missing or the ruleset is broken."
            exit 1
          fi
          COUNT=$(jq 'length' security-demo/leaks.json)
          echo "Gitleaks exited ${STATUS} with ${COUNT} finding(s)."
          {
            echo "### Gitleaks detected ${COUNT} planted credential(s)"
            echo ''
            echo '| Rule | File | Line |'
            echo '|---|---|---|'
            jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) |"' security-demo/leaks.json
          } >> "$GITHUB_STEP_SUMMARY"

  # One stable check name for branch protection to require; protecting each job
  # individually would silently drop a check on every rename or matrix change.
  # `if: always()` is load-bearing: a skipped dependency would otherwise skip
  # this job, which branch protection reads as "not failing".
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test
      - dependency-scan
      - secret-scan
      - lint-dockerfile
      - build
      - vulnerability-demo
    steps:
      - name: Verify every upstream job succeeded
        run: |
          echo 'Upstream results: ${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -qE '"result": *"(failure|cancelled|skipped)"'; then
            echo "::error::One or more CI jobs did not succeed."
            exit 1
          fi
          echo "All CI jobs succeeded."
